server:
  port: 17680
spring:
  application:
    name: client-demo

  # 禁用Nacos自动配置
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  datasource:
    username: micro
    password: 123456
    url: jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&autoReconnectForPools=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-packag: com.chandler.*.domain

info:
  app:
    name: ${spring.application.name}
    description: @project.description@
    version: project.build.sourceEncoding@
    java:
      version: @java.version@

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    link.thingscloud: DEBUG
    org.freeswitch.esl: DEBUG

# FreeSWITCH ESL Configuration (必须严格使用 link.thingscloud 前缀)
link:
  thingscloud:
    freeswitch:
      esl:
        inbound:
          default-password: ClueCon
          # 配置服务器地址和端口
          servers:
            - host: 127.0.0.1
              port: 8022
              timeout-seconds: 5
          # 让底层框架自动发送的订阅命令 (不要加 plain，框架会自动加)
          events:
            - CUSTOM sofia::register sofia::unregister sofia::expire sofia::gateway_state sofia::gateway_add sofia::gateway_del sofia::gateway_update GATEWAY_STATE GATEWAY_ADD GATEWAY_DEL CHANNEL_CREATE CHANNEL_ANSWER CHANNEL_BRIDGE CHANNEL_UNBRIDGE CHANNEL_HANGUP CHANNEL_DESTROY